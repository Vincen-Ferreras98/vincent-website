<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encouragement | Vincent Ferreras</title>
  <meta name="description" content="Encouraging King James Bible verses for hard times, good times and guidance.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A1628'/%3E%3Cpath d='M28 10h8v14h14v8H36v22h-8V32H14v-8h14z' fill='%23E8B84A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="encouragement">
  <div id="site-header"></div>

  <main id="top">
    <section class="block reveal">
      <h2 data-n="03">Encouraging verses for every season of life</h2>
      <p>Life has good days and hard days, and God's Word speaks into all of them. Choose a season below and read what the King James Bible says, with a short word of encouragement.</p>
      <div class="filters" role="group" aria-label="Filter verses" data-target="verse-list" data-limit="9" data-more="more-verses">
        <button type="button" class="chip active" data-filter="all">All</button>
        <button type="button" class="chip" data-filter="hard">Hard times</button>
        <button type="button" class="chip" data-filter="good">Good times</button>
        <button type="button" class="chip" data-filter="guide">Guidance</button>
      </div>
      <div id="verse-list" class="cards"></div>
      <p class="more-wrap"><button id="more-verses" class="btn ghost" type="button">Show all verses</button></p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
